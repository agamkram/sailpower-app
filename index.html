  <!--
    Desktop iOS-full-bleed.txt — Bug B (PWA short layout viewport).
    PWA: fillH = max(innerHeight, screen long edge) BEFORE first paint.
    Safari tab: visualViewport only. Do NOT use max-height:100dvh on PWA.
  -->
  <script>
    (function () {
      try {
        var host = location.hostname || "";
        var local = host === "localhost" || host === "127.0.0.1" || /^\d+\.\d+\.\d+\.\d+$/.test(host);
        if (local && navigator.serviceWorker) {
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            regs.forEach(function (reg) { reg.unregister(); });
          });
          if (window.caches && caches.keys) {
            caches.keys().then(function (keys) { keys.forEach(function (k) { caches.delete(k); }); });
          }
        }
        var r = document.documentElement;
        var n = window.navigator;
        var standalone =
          n.standalone === true ||
          (window.matchMedia &&
            (window.matchMedia("(display-mode: standalone)").matches ||
              window.matchMedia("(display-mode: fullscreen)").matches ||
              window.matchMedia("(display-mode: minimal-ui)").matches));
        var vv = window.visualViewport;
        var iw = window.innerWidth || 0;
        var ih = window.innerHeight || 0;
        var sw = (window.screen && window.screen.width) || 0;
        var sh = (window.screen && window.screen.height) || 0;
        var screenMax = Math.max(sw, sh);
        var screenMin = Math.min(sw, sh);
        if (standalone) {
          r.classList.add("pwa-standalone");
          var fillH = ih >= iw ? Math.max(ih, screenMax) : Math.max(ih, screenMin);
          var extra = 0;
          if (Math.min(iw, ih) >= 600 && screenMax < ih - 10) extra = 20;
          r.style.setProperty("--pwa-fill-h", fillH + "px");
          r.style.setProperty("--pwa-extra-b", extra + "px");
          r.style.setProperty("--vv-top", "0px");
          r.style.setProperty("--vv-left", "0px");
          r.style.setProperty("--vv-w", iw + "px");
          r.style.setProperty("--vv-h", fillH + extra + "px");
        } else if (vv && vv.height > 40 && vv.width > 40) {
          r.style.setProperty("--vv-top", Math.max(0, Math.round(vv.offsetTop) || 0) + "px");
          r.style.setProperty("--vv-left", Math.max(0, Math.round(vv.offsetLeft) || 0) + "px");
          r.style.setProperty("--vv-w", Math.round(vv.width) + "px");
          r.style.setProperty("--vv-h", Math.round(vv.height) + "px");
        } else {
          r.style.setProperty("--vv-top", "0px");
          r.style.setProperty("--vv-left", "0px");
          r.style.setProperty("--vv-w", iw + "px");
          r.style.setProperty("--vv-h", ih + "px");
        }
      } catch (e) {}
    })();
  </script>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
  <link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <link rel="stylesheet" href="styles.css?v=207" />
</head>
<body>
  <div class="fit-stage" id="fit-stage">
    <div class="app" id="app">
      <header>
        <h1>SailPower</h1>
      </header>

      <div class="stage-wrap">
        <canvas id="view" aria-label="Sail on the rail. Drag to look around, shift-drag or two fingers to slide along the ground, pinch or scroll to zoom, double-tap to reset."></canvas>
        <p class="view-tag view-wind" id="view-wind">0 m/s</p>
        <p class="view-tag view-area" id="view-area">0 m²</p>
        <p class="cam-hint" id="cam-hint">drag orbits · shift-drag or two fingers slide</p>
        <p class="build-tag" id="build-tag" aria-hidden="true"></p>
        <div class="track-map" id="track-map" role="slider" tabindex="0"
             aria-label="Scrub through one cycle" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <i id="map-dot"></i>
        </div>
      </div>

      <div class="lower">
        <div class="deck-main" aria-live="polite">
          <div class="readout">
            <section class="now-col">
              <h2>Now</h2>
              <div class="meter">
                <div class="meter-top">
                  <span>Power</span>
                  <span id="watts">0 W</span>
                </div>
                <div class="meter-track">
                  <i class="bar make full" id="bar-make"></i>
                  <i class="peak" id="peak-make"></i>
                </div>
              </div>
              <div class="meter">
                <div class="meter-top">
                  <span>Motor</span>
                  <span id="motor">0 W</span>
                </div>
                <div class="meter-track">
                  <i class="bar use full" id="bar-motor"></i>
                  <i class="peak" id="peak-motor"></i>
                </div>
              </div>
              <div class="meter">
                <div class="meter-top">
                  <span>Speed</span>
                  <span id="speed">0.0 m/s</span>
                </div>
                <div class="meter-track">
                  <i class="bar home" id="bar-home"></i>
                  <i class="bar out" id="bar-out"></i>
                  <i class="peak home" id="peak-home"></i>
                  <i class="peak out" id="peak-out"></i>
                  <i class="zero"></i>
                </div>
              </div>
            </section>
            <section class="trip-col">
              <div class="trip-table">
                <span></span>
                <h2>Trip</h2>
                <h2>Last</h2>
                <h2>Save</h2>
                <span class="lab">net</span>
                <span id="net">0 W</span>
                <span id="l-net">0 W</span>
                <span id="s-net">0 W</span>
                <span class="lab">made</span>
                <span id="t-made">0 W</span>
                <span id="l-made">0 W</span>
                <span id="s-made">0 W</span>
                <span class="lab">motor</span>
                <span id="t-motor">0 W</span>
                <span id="l-motor">0 W</span>
                <span id="s-motor">0 W</span>
                <span class="lab">slew</span>
                <span id="t-slew">0 W</span>
                <span id="l-slew">0 W</span>
                <span id="s-slew">0 W</span>
                <span class="lab">loss</span>
                <span id="t-loss">0 W</span>
                <span id="l-loss">0 W</span>
                <span id="s-loss">0 W</span>
                <span class="lab">stops</span>
                <span id="t-stop">0 W</span>
                <span id="l-stop">0 W</span>
                <span id="s-stop">0 W</span>
              </div>
            </section>
          </div>
          <p class="warn" id="warn"></p>
          <div class="actions">
            <button type="button" class="go" id="run">Run</button>
            <button type="button" id="specs-btn">Specs</button>
            <button type="button" id="save-btn">Save</button>
          </div>
        </div>
      </div>

      <form class="sheet" id="sheet" hidden>
        <div class="sheet-head">
          <h2>Specs</h2>
          <output id="o-area" class="sheet-area"></output>
        </div>
        <label class="field">Wind <output id="o-wind"></output>
          <input id="wind" type="range" min="0" max="20" step="0.5" />
        </label>
        <label class="field">Sail width <output id="o-plateW"></output>
          <input id="plateW" type="range" min="1" max="8" step="0.1" />
        </label>
        <label class="field">Sail height <output id="o-plateH"></output>
          <input id="plateH" type="range" min="0.4" max="5" step="0.1" />
        </label>
        <label class="field">Track <output id="o-track"></output>
          <input id="track" type="range" min="8" max="40" step="1" />
        </label>
        <label class="field">Out speed <output id="o-outFrac"></output>
          <input id="outFrac" type="range" min="0.15" max="0.6" step="0.01" />
        </label>
        <label class="field">Return speed <output id="o-vReturn"></output>
          <input id="vReturn" type="range" min="1" max="16" step="0.5" data-adaptive />
        </label>
        <label class="field">Turn <output id="o-turn"></output>
          <input id="turn" type="range" min="0.2" max="3" step="0.1" data-adaptive />
        </label>
        <label class="field">Harvest <output id="o-harvest"></output>
          <input id="harvest" type="range" min="0" max="100" step="1" />
        </label>
        <div class="sheet-actions">
          <button type="button" id="solve">Best</button>
          <button type="button" id="defaults">Defaults</button>
          <button type="button" class="primary" id="close-specs">Done</button>
        </div>
      </form>
    </div>
  </div>
  <script type="module" src="app.js?v=207"></script>
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
