  <!--
    Desktop iOS-full-bleed.txt — Bug B (PWA short layout viewport).
    PWA: fillH = max(innerHeight, screen long edge) BEFORE first paint.
    Safari tab: visualViewport only. Do NOT use max-height:100dvh on PWA.
  -->
  <script>
    (function () {
      try {
        var host = location.hostname || "";
        var local = host === "localhost" || host === "127.0.0.1" || /^\d+\.\d+\.\d+\.\d+$/.test(host);
        if (local && navigator.serviceWorker) {
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            regs.forEach(function (reg) { reg.unregister(); });
          });
          if (window.caches && caches.keys) {
            caches.keys().then(function (keys) { keys.forEach(function (k) { caches.delete(k); }); });
          }
        }
        var r = document.documentElement;
        var n = window.navigator;
        var standalone =
          n.standalone === true ||
          (window.matchMedia &&
            (window.matchMedia("(display-mode: standalone)").matches ||
              window.matchMedia("(display-mode: fullscreen)").matches ||
              window.matchMedia("(display-mode: minimal-ui)").matches));
        var vv = window.visualViewport;
        var iw = window.innerWidth || 0;
        var ih = window.innerHeight || 0;
        var sw = (window.screen && window.screen.width) || 0;
        var sh = (window.screen && window.screen.height) || 0;
        var screenMax = Math.max(sw, sh);
        var screenMin = Math.min(sw, sh);
        if (standalone) {
          r.classList.add("pwa-standalone");
          var fillH = ih >= iw ? Math.max(ih, screenMax) : Math.max(ih, screenMin);
          var extra = 0;
          if (Math.min(iw, ih) >= 600 && screenMax < ih - 10) extra = 20;
          r.style.setProperty("--pwa-fill-h", fillH + "px");
          r.style.setProperty("--pwa-extra-b", extra + "px");
          r.style.setProperty("--vv-top", "0px");
          r.style.setProperty("--vv-left", "0px");
          r.style.setProperty("--vv-w", iw + "px");
          r.style.setProperty("--vv-h", fillH + extra + "px");
        } else if (vv && vv.height > 40 && vv.width > 40) {
          r.style.setProperty("--vv-top", Math.max(0, Math.round(vv.offsetTop) || 0) + "px");
          r.style.setProperty("--vv-left", Math.max(0, Math.round(vv.offsetLeft) || 0) + "px");
          r.style.setProperty("--vv-w", Math.round(vv.width) + "px");
          r.style.setProperty("--vv-h", Math.round(vv.height) + "px");
        } else {
          r.style.setProperty("--vv-top", "0px");
          r.style.setProperty("--vv-left", "0px");
          r.style.setProperty("--vv-w", iw + "px");
          r.style.setProperty("--vv-h", ih + "px");
        }
      } catch (e) {}
    })();
  </script>

</head>
<body>
  <div class="fit-stage" id="fit-stage">
    <div class="app" id="app">
      <header>
        <h1>WindCart</h1>
      </header>

      <div class="stage-wrap">
        <canvas id="view" aria-label="Wind cart on the rail. Drag to orbit, pinch or scroll to zoom, double-tap to reset."></canvas>
        <p class="cam-hint" id="cam-hint">drag · pinch · double-tap reset</p>
        <div class="track-map" id="track-map" role="slider" tabindex="0"
             aria-label="Scrub through one cycle" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <i id="map-dot"></i>
        </div>
      </div>

      <section class="meters" aria-live="polite">
        <div class="phase-row">
          <span class="phase" id="phase">Ready</span>
          <span class="speed" id="speed">0.0 m/s</span>
        </div>
        <div class="phase-row">
          <div class="pbar" id="pbar" aria-hidden="true">
            <div class="pbar-zero"></div>
            <div class="pbar-fill" id="pfill"></div>
          </div>
          <span class="watts" id="watts">0 W</span>
        </div>
        <p class="scale" id="scale"></p>
        <div class="net-row">
          <span class="net" id="net">net 0.00 kJ</span>
          <span class="substat" id="substat">0 cycles</span>
        </div>
        <p class="warn" id="warn"></p>
      </section>

      <section class="plan" aria-label="Rotation plan">
        <p class="plan-note" id="plan-note"></p>
      </section>

      <div class="actions">
        <button type="button" class="go" id="run">Run</button>
        <button type="button" id="specs-btn">Specs</button>
        <button type="button" id="rate">1×</button>
      </div>

      <form class="sheet" id="sheet" hidden>
        <div class="sheet-head">
          <h2>Specs</h2>
          <output id="o-area" class="sheet-area"></output>
        </div>
        <label class="field">Wind <output id="o-wind"></output>
          <input id="wind" type="range" min="0" max="20" step="0.5" />
        </label>
        <label class="field">Sail width <output id="o-plateW"></output>
          <input id="plateW" type="range" min="1" max="8" step="0.1" />
        </label>
        <label class="field">Sail height <output id="o-plateH"></output>
          <input id="plateH" type="range" min="0.4" max="5" step="0.1" />
        </label>
        <label class="field">Track <output id="o-track"></output>
          <input id="track" type="range" min="8" max="40" step="1" />
        </label>
        <label class="field">Chassis <output id="o-mass"></output>
          <input id="mass" type="range" min="10" max="200" step="1" />
        </label>
        <label class="field">Out speed <output id="o-outFrac"></output>
          <input id="outFrac" type="range" min="0.15" max="0.6" step="0.01" />
        </label>
        <label class="field">Return speed <output id="o-vReturn"></output>
          <input id="vReturn" type="range" min="1" max="16" step="0.5" />
        </label>
        <label class="field">Turn <output id="o-turn"></output>
          <input id="turn" type="range" min="0.3" max="3" step="0.1" />
        </label>
        <label class="field">Rail force <output id="o-fMax"></output>
          <input id="fMax" type="range" min="200" max="3000" step="50" />
        </label>
        <label class="field">Drag <output id="o-cd"></output>
          <input id="cd" type="range" min="0.6" max="2" step="0.02" />
        </label>
        <label class="field">Efficiency <output id="o-eta"></output>
          <input id="eta" type="range" min="0.5" max="0.98" step="0.01" />
        </label>
        <label class="field">Rolling <output id="o-crr"></output>
          <input id="crr" type="range" min="0.001" max="0.04" step="0.001" />
        </label>
        <div class="sheet-actions">
          <button type="button" id="solve">Solve</button>
          <button type="button" id="defaults">Defaults</button>
          <button type="button" class="primary" id="close-specs">Done</button>
        </div>
      </form>
    </div>
  </div>
  <script type="module" src="app.js?v=114"></script>
</body>
</html>
